name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build
        run: make
      - name: Version
        run: ./aster --version
      - name: Check
        run: make check
      - name: Install layout smoke test
        run: |
          prefix="$RUNNER_TEMP/aster-prefix"
          make install PREFIX="$prefix"
          work="$RUNNER_TEMP/aster-smoke"
          mkdir -p "$work"
          cd "$work"
          printf 'import aster.math as math;\nprintln(math.sqrt(16.0));\n' > smoke.ast
          env -u ASTER_HOME "$prefix/bin/aster" smoke.ast

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - name: Build
        run: make
      - name: Version
        run: ./aster --version
      - name: Check
        run: make check

  windows:
    name: Windows (MSYS2 UCRT64)
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build
        run: make
      - name: Version
        run: ./aster.exe --version
      - name: Check
        run: make check PYTHON=python

  sanitizers:
    name: ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build with sanitizers
        run: |
          make clean
          make \
            CFLAGS="-std=c11 -O1 -g -Wall -Wextra -IInclude -fsanitize=address,undefined -fno-omit-frame-pointer" \
            LDLIBS="-lm -fsanitize=address,undefined"
      - name: Check
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: make check
